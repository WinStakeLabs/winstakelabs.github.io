<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found · WinStake Labs</title>
<link rel="stylesheet" href="common.css">
<link rel="icon" type="image/png" href="winstakelabs.png">

<style>
body {
  align-items: center; justify-content: center;
  padding: 2rem; text-align: center;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background: radial-gradient(ellipse 800px 600px at 50% 50%, rgba(212,168,90,0.06) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}
.content { position: relative; z-index: 2; max-width: 600px; }
img.logo { width: 80px; height: 80px; border-radius: 8px; margin-bottom: 2rem; background: #fff; padding: 4px; }
h1 { font-family: var(--font-display); font-size: clamp(4rem, 12vw, 8rem); color: var(--gold); letter-spacing: 0.02em; line-height: 1; margin-bottom: 1rem; }
.subtitle { font-family: var(--font-display); font-size: clamp(1.5rem, 4vw, 2.2rem); letter-spacing: 0.04em; color: var(--text); margin-bottom: 1.5rem; }
p { color: var(--text-muted); font-size: 1rem; line-height: 1.7; margin-bottom: 2.5rem; }
.actions { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; }
.footer-note { margin-top: 4rem; font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-dim); letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="content">
  <img src="winstakelabs_w.png" class="logo" alt="WinStake Labs">
  <div class="section-tag">Page not found</div>
  <h1>404</h1>
  <div class="subtitle">This page doesn't exist</div>
  <p>The page you were looking for may have been moved, renamed, or simply doesn't exist on this site. Let's get you back to safer ground.</p>
  <div class="actions">
    <a href="index.html" class="btn-primary">Back to home</a>
    <a href="tools.html" class="btn-secondary">Tools Hub</a>
  </div>
  <div class="footer-note">© 2026 WinStake Labs · Solana Validator</div>
</div>
</body>
</html>
